<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="show"><span id="span"></span></div>
      <div>
        <input id="all" value="A/C" type="button" />
        <input id="delete" value="Delete" type="button" />
        <input id="percent" value="%" type="button" />
        <input id="divide" class="op" value="/" type="button" />
      </div>

      <div>
        <input id="seven" value="7" type="button" />
        <input id="eight" value="8" type="button" />
        <input id="nine" value="9" type="button" />
        <input id="mul" class="op" value="*" type="button" />
      </div>

      <div>
        <input id="four" value="4" type="button" />
        <input id="five" value="5" type="button" />
        <input id="six" value="6" type="button" />
        <input id="sub" class="op" value="-" type="button" />
      </div>
      <div>
        <input id="one" value="1" type="button" />
        <input id="two" value="2" type="button" />
        <input id="three" value="3" type="button" />
        <input id="plus" class="op" value="+" type="button" />
      </div>
      <div id="last-div">
        <input id="zero" value="0" type="button" />
        <input id="dot" value="." type="button" />
        <input id="equal" class="op" value="=" type="button" />
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
